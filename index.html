<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>On and off</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <center> 
        
    <div class="button"> 
       <h1>Project of ON and OFF the Bulb</h1>
        
        <img id="bulb" src="off.png" alt="Bulb">
        <br><br>
        <button class="bOn" onclick="document.getElementById('bulb').src = 'on.png'">Turn On</button>
        <button class="bOff" onclick="document.getElementById('bulb').src = 'off.png'">Turn Off</button>
    </div>
    </center>
</body>
</html>
